# À placer tel quel dans chaque stack Dockge :
#   /opt/dockge/stacks/cesizen-test/compose.yaml
#   /opt/dockge/stacks/cesizen-qualif/compose.yaml
#   /opt/dockge/stacks/cesizen-production/compose.yaml
#
# Chaque dossier a son propre .env (voir .env.example) — c'est lui qui différencie
# les 3 environnements (port, secrets, nom de la base, image utilisée).

services:
  php:
    image: ghcr.io/${GHCR_REPOSITORY}:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-prod}
      APP_DEBUG: "0"
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?serverVersion=18&charset=utf8
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY}
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - app_log:/var/www/html/var/log

  nginx:
    image: ghcr.io/${GHCR_REPOSITORY}-nginx:${IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT}:80"
    depends_on:
      - php

  database:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
    healthcheck:
      test: [ "CMD", "pg_isready", "-d", "${POSTGRES_DB}", "-U", "${POSTGRES_USER:-postgres}" ]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql:rw

volumes:
  database_data:
  app_log:
